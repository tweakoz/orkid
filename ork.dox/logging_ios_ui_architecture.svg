<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="300" y="25" font-family="monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">iOS UI Backend Architecture</text>

  <!-- iOS Application (outermost) -->
  <rect x="30" y="45" width="540" height="340" rx="8" fill="#0d0d0d" stroke="#444" stroke-width="2"/>
  <text x="50" y="68" font-family="monospace" font-size="12" fill="#8cf" font-weight="bold">iOS Application</text>

  <!-- Main View Controller -->
  <rect x="50" y="80" width="500" height="290" rx="6" fill="#1a1a1a" stroke="#3a5a7a" stroke-width="1.5"/>
  <text x="70" y="103" font-family="monospace" font-size="11" fill="#6af" font-weight="bold">Main View Controller</text>

  <!-- Channel Buttons section -->
  <rect x="70" y="115" width="460" height="55" rx="4" fill="#252525" stroke="#444" stroke-width="1"/>
  <text x="90" y="135" font-family="monospace" font-size="10" fill="#888">Channel Buttons (dynamic)</text>

  <!-- Button examples -->
  <rect x="90" y="145" width="60" height="20" rx="3" fill="#1a3a2a" stroke="#4f8" stroke-width="1"/>
  <text x="120" y="159" font-family="monospace" font-size="9" fill="#4f8" text-anchor="middle">AUDIO</text>

  <rect x="160" y="145" width="60" height="20" rx="3" fill="#3a1a1a" stroke="#f88" stroke-width="1"/>
  <text x="190" y="159" font-family="monospace" font-size="9" fill="#f88" text-anchor="middle">RENDER</text>

  <rect x="230" y="145" width="70" height="20" rx="3" fill="#1a1a3a" stroke="#88f" stroke-width="1"/>
  <text x="265" y="159" font-family="monospace" font-size="9" fill="#88f" text-anchor="middle">NETWORK</text>

  <text x="315" y="159" font-family="monospace" font-size="10" fill="#555">...</text>

  <!-- OrkLogChannelViewController section -->
  <rect x="70" y="180" width="460" height="175" rx="4" fill="#1d1d1d" stroke="#4a6a4a" stroke-width="1"/>
  <text x="90" y="200" font-family="monospace" font-size="10" fill="#6a8" font-weight="bold">OrkLogChannelViewController</text>

  <!-- UITextView (innermost) -->
  <rect x="90" y="212" width="420" height="130" rx="4" fill="#0a1a0a" stroke="#3a5a3a" stroke-width="1"/>
  <text x="110" y="232" font-family="monospace" font-size="10" fill="#8c8" font-weight="bold">UITextView</text>
  <text x="220" y="232" font-family="monospace" font-size="9" fill="#666">(Menlo 12pt)</text>

  <!-- UITextView properties -->
  <g font-family="monospace" font-size="10">
    <circle cx="115" cy="260" r="3" fill="#4f8"/>
    <text x="125" y="264" fill="#aaa">Channel-colored text</text>

    <circle cx="115" cy="285" r="3" fill="#4f8"/>
    <text x="125" y="289" fill="#aaa">Darkened channel-color background</text>

    <circle cx="115" cy="310" r="3" fill="#4f8"/>
    <text x="125" y="314" fill="#aaa">Auto-scroll enabled</text>
  </g>
</svg>
