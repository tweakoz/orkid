<svg viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="500" fill="#0f172a"/>

  <!-- Title -->
  <text x="375" y="32" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">HFSM Example: Test State Machine</text>

  <!-- ROOT State (outermost container) -->
  <rect x="30" y="55" width="690" height="390" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <rect x="30" y="55" width="690" height="35" rx="16" fill="#334155"/>
  <rect x="30" y="75" width="690" height="15" fill="#334155"/>
  <text x="375" y="78" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#94a3b8">ROOT</text>

  <!-- SA State (left container) -->
  <rect x="55" y="110" width="310" height="310" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <rect x="55" y="110" width="310" height="30" rx="12" fill="#2563eb"/>
  <rect x="55" y="128" width="310" height="12" fill="#2563eb"/>
  <text x="210" y="132" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="white">SA</text>

  <!-- S1 State (inside SA) -->
  <rect x="80" y="165" width="120" height="90" rx="10" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="200" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="white">S1</text>
  <text x="140" y="220" text-anchor="middle" font-family="Arial" font-size="9" fill="#a5b4fc">onEnter(inst)</text>
  <text x="140" y="233" text-anchor="middle" font-family="Arial" font-size="9" fill="#a5b4fc">onExit(inst)</text>
  <text x="140" y="246" text-anchor="middle" font-family="Arial" font-size="9" fill="#a5b4fc">onUpdate(inst)</text>

  <!-- S2 State (inside SA) -->
  <rect x="220" y="165" width="120" height="90" rx="10" fill="#312e81" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="200" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="white">S2</text>
  <text x="280" y="220" text-anchor="middle" font-family="Arial" font-size="9" fill="#a5b4fc">onEnter(inst)</text>
  <text x="280" y="233" text-anchor="middle" font-family="Arial" font-size="9" fill="#a5b4fc">onExit(inst)</text>
  <text x="280" y="246" text-anchor="middle" font-family="Arial" font-size="9" fill="#a5b4fc">onUpdate(inst)</text>

  <!-- SB State (right container) -->
  <rect x="385" y="110" width="310" height="310" rx="12" fill="#134e4a" stroke="#14b8a6" stroke-width="2"/>
  <rect x="385" y="110" width="310" height="30" rx="12" fill="#0f766e"/>
  <rect x="385" y="128" width="310" height="12" fill="#0f766e"/>
  <text x="540" y="132" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="white">SB</text>

  <!-- S3 State (inside SB) -->
  <rect x="480" y="165" width="120" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="200" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="white">S3</text>
  <text x="540" y="220" text-anchor="middle" font-family="Arial" font-size="9" fill="#6ee7b7">onEnter(inst)</text>
  <text x="540" y="233" text-anchor="middle" font-family="Arial" font-size="9" fill="#6ee7b7">onExit(inst)</text>
  <text x="540" y="246" text-anchor="middle" font-family="Arial" font-size="9" fill="#6ee7b7">onUpdate(inst)</text>

  <!-- Initial state indicator for S1 -->
  <circle cx="80" cy="210" r="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <circle cx="80" cy="210" r="4" fill="#22c55e"/>
  <line x1="88" y1="210" x2="75" y2="210" stroke="#22c55e" stroke-width="2"/>

  <!-- Transition: S1 -> S2 (e1to2) -->
  <path d="M 200 210 L 215 210" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="155" y="270" width="90" height="24" rx="4" fill="#78350f" stroke="#f59e0b"/>
  <text x="200" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#fcd34d">e1to2</text>
  <line x1="200" y1="255" x2="200" y2="268" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Transition: S2 -> S3 (e2to3) - crosses hierarchy -->
  <path d="M 340 210 Q 410 210 410 180 Q 410 165 475 200" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="378" y="270" width="90" height="24" rx="4" fill="#78350f" stroke="#f59e0b"/>
  <text x="423" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#fcd34d">e2to3</text>
  <line x1="410" y1="185" x2="423" y2="268" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Cross-hierarchy indicator -->
  <rect x="365" y="135" width="20" height="120" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Legend -->
  <rect x="55" y="330" width="305" height="80" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="207" y="352" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Transition Sequence: S2 → S3</text>

  <rect x="70" y="365" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="88" y="375" font-family="Arial" font-size="9" fill="#fca5a5">1. S2.onExit(inst)</text>

  <rect x="170" y="365" width="12" height="12" rx="2" fill="#dc2626"/>
  <text x="188" y="375" font-family="Arial" font-size="9" fill="#fca5a5">2. SA.onExit(inst)</text>

  <rect x="70" y="385" width="12" height="12" rx="2" fill="#059669"/>
  <text x="88" y="395" font-family="Arial" font-size="9" fill="#6ee7b7">3. SB.onEnter(inst)</text>

  <rect x="170" y="385" width="12" height="12" rx="2" fill="#22c55e"/>
  <text x="188" y="395" font-family="Arial" font-size="9" fill="#6ee7b7">4. S3.onEnter(inst)</text>

  <text x="290" y="395" font-family="Arial" font-size="9" fill="#6b7280">(ROOT unchanged)</text>

  <!-- Event definitions -->
  <rect x="385" y="330" width="305" height="80" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="537" y="352" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Token-Based Events (CRC64)</text>

  <text x="400" y="375" font-family="monospace" font-size="10" fill="#fcd34d">"e1to2"_crcu</text>
  <text x="400" y="395" font-family="monospace" font-size="10" fill="#fcd34d">"e2to3"_crcu</text>

  <text x="530" y="375" font-family="Arial" font-size="9" fill="#6b7280">// Compile-time CRC64 hash</text>
  <text x="530" y="395" font-family="Arial" font-size="9" fill="#6b7280">// Or: CrcString("event").hashed()</text>

  <!-- State count indicator -->
  <text x="680" y="475" text-anchor="end" font-family="Arial" font-size="10" fill="#475569">6 states, 2 transitions</text>
</svg>
