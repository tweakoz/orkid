<svg viewBox="0 0 850 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="850" height="500" fill="#1a1a2e"/>
  <text x="425" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">Event Processing Flow (Token-Based)</text>

  <!-- Event Queue -->
  <rect x="30" y="60" width="200" height="180" rx="8" fill="#252540" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fbbf24">Event Queue</text>
  <text x="130" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">MpMcBoundedQueue&lt;16&gt;</text>

  <rect x="50" y="120" width="160" height="25" rx="4" fill="#854d0e" stroke="#facc15"/>
  <text x="130" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="white">ChangeStateEvent(S1)</text>

  <rect x="50" y="150" width="160" height="25" rx="4" fill="#0e7490" stroke="#22d3ee"/>
  <text x="130" y="168" text-anchor="middle" font-family="monospace" font-size="10" fill="white">TokenEvent(0xa1b2...)</text>

  <rect x="50" y="180" width="160" height="25" rx="4" fill="#0e7490" stroke="#22d3ee"/>
  <text x="130" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="white">TokenEvent("start"_crcu)</text>

  <text x="130" y="228" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">CRC64 hashed event tokens</text>

  <!-- Update loop -->
  <rect x="280" y="60" width="260" height="340" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">FsmInstance::update(inst)</text>

  <!-- Step 1: Pop event -->
  <rect x="300" y="105" width="220" height="45" rx="6" fill="#2d4a6f" stroke="#60a5fa"/>
  <text x="410" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="white">_pendingEvents.try_pop()</text>
  <text x="410" y="142" text-anchor="middle" font-family="Arial" font-size="9" fill="#93c5fd">Get next event from queue</text>

  <!-- Decision: ChangeStateEvent? -->
  <polygon points="410,170 470,200 410,230 350,200" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
  <text x="410" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="white">CSE?</text>

  <!-- Yes: perform state change -->
  <rect x="300" y="250" width="220" height="40" rx="6" fill="#065f46" stroke="#34d399"/>
  <text x="410" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="white">_performStateChange(to)</text>

  <!-- No: TokenEvent -->
  <rect x="300" y="310" width="220" height="70" rx="6" fill="#0e7490" stroke="#22d3ee"/>
  <text x="410" y="330" text-anchor="middle" font-family="monospace" font-size="10" fill="white">TokenEvent?</text>
  <text x="410" y="350" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5f3fc">_current->_transitions[token]</text>
  <text x="410" y="368" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">O(1) hash map lookup</text>

  <!-- Arrows in update loop -->
  <line x1="410" y1="150" x2="410" y2="165" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="480" y="190" font-family="Arial" font-size="9" fill="#34d399">yes</text>
  <path d="M 470 200 L 500 200 L 500 270 L 525 270" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <line x1="500" y1="270" x2="410" y2="270" stroke="#34d399" stroke-width="1.5"/>

  <text x="340" y="220" font-family="Arial" font-size="9" fill="#22d3ee">no</text>
  <line x1="410" y1="230" x2="410" y2="305" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Transition check -->
  <rect x="580" y="60" width="240" height="220" rx="8" fill="#252540" stroke="#4a4a6a"/>
  <text x="700" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">Transition Check</text>

  <rect x="600" y="105" width="200" height="45" rx="6" fill="#1f2937" stroke="#6b7280"/>
  <text x="700" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#d1d5db">token_trans_map_t</text>
  <text x="700" y="142" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">unordered_map&lt;uint64_t, ...&gt;</text>

  <rect x="600" y="160" width="200" height="50" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="700" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#c4b5fd">trans._predicate(inst)</text>
  <text x="700" y="197" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Guard receives fsminstance_ptr_t</text>

  <rect x="600" y="220" width="200" height="45" rx="6" fill="#065f46" stroke="#34d399"/>
  <text x="700" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">_performStateChange(</text>
  <text x="700" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">  trans._destination)</text>

  <!-- Arrow from transition to update -->
  <line x1="525" y1="345" x2="595" y2="150" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Final update -->
  <rect x="580" y="300" width="240" height="90" rx="8" fill="#1f2937" stroke="#6b7280"/>
  <text x="700" y="325" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">After Queue Empty</text>
  <rect x="600" y="340" width="200" height="35" rx="4" fill="#374151"/>
  <text x="700" y="363" text-anchor="middle" font-family="monospace" font-size="10" fill="#d1d5db">_current->onUpdate(inst)</text>

  <!-- Flow arrows -->
  <line x1="230" y1="160" x2="275" y2="125" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Group notify -->
  <rect x="580" y="410" width="240" height="70" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="700" y="435" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Group Notification</text>
  <text x="700" y="455" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">_group->_notifyStateChange()</text>
  <text x="700" y="470" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Wakes waitForAllInState()</text>

  <!-- Legend -->
  <rect x="30" y="260" width="200" height="110" rx="6" fill="#252540"/>
  <text x="130" y="285" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Event Types</text>
  <rect x="50" y="295" width="20" height="15" rx="2" fill="#854d0e"/>
  <text x="80" y="307" font-family="Arial" font-size="9" fill="#facc15">ChangeStateEvent</text>
  <rect x="50" y="315" width="20" height="15" rx="2" fill="#0e7490"/>
  <text x="80" y="327" font-family="Arial" font-size="9" fill="#22d3ee">TokenEvent (CRC64)</text>
  <text x="50" y="350" font-family="monospace" font-size="9" fill="#9ca3af">"event"_crcu = compile-time</text>
  <text x="50" y="365" font-family="monospace" font-size="9" fill="#9ca3af">CrcString().hashed() = runtime</text>
</svg>
