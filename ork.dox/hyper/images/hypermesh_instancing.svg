<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#1a1a2e"/>

  <!-- lane backgrounds -->
  <rect x="0" y="38" width="1000" height="216" fill="#252540"/>
  <rect x="0" y="254" width="1000" height="254" fill="#20203a"/>
  <rect x="0" y="508" width="1000" height="228" fill="#252540"/>

  <text x="500" y="26" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">hypermesh — instance rendering: sources → per-view cull → indirect draw</text>

  <!-- lane separators -->
  <line x1="16" y1="254" x2="984" y2="254" stroke="#4a5568" stroke-dasharray="6 4"/>
  <line x1="16" y1="508" x2="984" y2="508" stroke="#4a5568" stroke-dasharray="6 4"/>

  <!-- ================= SOURCES ================= -->
  <text x="20" y="54" font-family="Arial" font-size="12" font-weight="bold" fill="#aaa">INSTANCESET SOURCES — placements are data; the mesh is evaluated ONCE</text>

  <rect x="20" y="66" width="190" height="64" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="86" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">terrain ScatterPlace</text>
  <text x="115" y="103" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">bakes each scatter sink</text>
  <text x="115" y="118" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">at terrain materialize</text>

  <line x1="210" y1="98" x2="244" y2="98" stroke="#666" marker-end="url(#arr)"/>

  <rect x="246" y="66" width="180" height="64" rx="8" fill="#5a4a3a" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="336" y="86" font-family="monospace" font-size="12.5" font-weight="bold" fill="white" text-anchor="middle">&lt;sink&gt;.ogeo</text>
  <text x="336" y="103" font-family="monospace" font-size="10.5" fill="#fed7aa" text-anchor="middle">point channels: xform,</text>
  <text x="336" y="118" font-family="monospace" font-size="10.5" fill="#fed7aa" text-anchor="middle">type_id, variant_seed</text>

  <line x1="426" y1="98" x2="460" y2="98" stroke="#666" marker-end="url(#arr)"/>

  <rect x="462" y="66" width="256" height="78" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="85" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">fillInstanceSetFromScatter</text>
  <text x="590" y="102" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">reads once, filters type_id;</text>
  <text x="590" y="117" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">graph ScatterSource OR drawable</text>
  <text x="590" y="132" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">instance_source= (LOD-shared, wins)</text>

  <rect x="20" y="168" width="190" height="70" rx="8" fill="#1e3a5f" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="188" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">instance_source()</text>
  <text x="115" y="205" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">DSL: REPLACE semantics,</text>
  <text x="115" y="220" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">last-wins, never terminal</text>

  <!-- DSL source feeds the shared resolver (over the row gap, into its bottom edge) -->
  <polyline points="115,168 115,158 560,158 560,146" fill="none" stroke="#666" marker-end="url(#arr)"/>

  <rect x="246" y="168" width="200" height="70" rx="8" fill="#1e3a5f" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="346" y="188" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">forest_matrices()</text>
  <text x="346" y="205" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">_forest.py jittered grid;</text>
  <text x="346" y="220" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">wind in bottom-row floats</text>

  <line x1="446" y1="203" x2="480" y2="203" stroke="#666" marker-end="url(#arr)"/>

  <rect x="482" y="168" width="236" height="70" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="188" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">legacy instances= floats</text>
  <text x="600" y="205" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">auto-convert: bottom rows split</text>
  <text x="600" y="220" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">into synthesized attrs, zeroed</text>

  <rect x="752" y="80" width="228" height="140" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="866" y="102" font-family="monospace" font-size="13.5" font-weight="bold" fill="white" text-anchor="middle">InstanceSet</text>
  <text x="866" y="122" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">_matrices: mat4[N] col-major</text>
  <text x="866" y="137" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">_attrs: vec4[N] x=type_id</text>
  <text x="866" y="152" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">y=seed01 · _version bump</text>
  <text x="866" y="175" font-family="monospace" font-size="10.5" fill="#fbbf24" text-anchor="middle">opt-in only:</text>
  <text x="866" y="190" font-family="monospace" font-size="10.5" fill="#fbbf24" text-anchor="middle">make_drawable(</text>
  <text x="866" y="205" font-family="monospace" font-size="10.5" fill="#fbbf24" text-anchor="middle">  instance_from=...)</text>

  <line x1="718" y1="105" x2="750" y2="105" stroke="#666" marker-end="url(#arr)"/>
  <line x1="718" y1="203" x2="750" y2="203" stroke="#666" marker-end="url(#arr)"/>

  <!-- elbow: InstanceSet -> cull lane -->
  <polyline points="866,220 866,242 113,242 113,310" fill="none" stroke="#666" marker-end="url(#arr)"/>
  <text x="490" y="250" font-family="Arial" font-size="11" fill="#aaa" text-anchor="middle">IN_M / IN_A SSBOs</text>

  <!-- ================= PER-VIEW CULL ================= -->
  <text x="20" y="270" font-family="Arial" font-size="12" font-weight="bold" fill="#aaa">PER-VIEW GPU CULL — MeshInstCull, one per instanced variant</text>

  <rect x="14" y="278" width="972" height="158" rx="10" fill="none" stroke="#a78bfa" stroke-dasharray="7 5"/>
  <text x="500" y="296" font-family="Arial" font-size="12" font-style="italic" fill="#c4b5fd" text-anchor="middle">Scene::preRender — once per drawable per viewport (VR: once, head camera) · ONE dispatch phase, all variants batched</text>

  <rect x="28" y="310" width="170" height="86" rx="8" fill="#1a3a3a" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="113" y="332" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">cs_cull_reset</text>
  <text x="113" y="350" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">zero stat counters</text>
  <text x="113" y="365" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">+ per-tier VIS[]</text>
  <text x="113" y="380" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle">(GPU-owned tail)</text>

  <line x1="198" y1="353" x2="230" y2="353" stroke="#666" marker-end="url(#arr)"/>

  <rect x="232" y="310" width="336" height="86" rx="8" fill="#1a3a3a" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="330" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">cs_cull — per instance</text>
  <text x="400" y="348" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">frustum × 1/CullFrustumScale · distance</text>
  <text x="400" y="363" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">HZB occlusion: hidden iff ALL K slabs</text>
  <text x="400" y="378" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">LOD tier by eye distance → VIS[t]++</text>
  <text x="400" y="392" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle">ambiguity always resolves toward drawing</text>

  <line x1="568" y1="353" x2="600" y2="353" stroke="#666" marker-end="url(#arr)"/>

  <rect x="602" y="310" width="368" height="86" rx="8" fill="#1a3a3a" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="786" y="330" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">cs_cull_fanout — once per tier</text>
  <text x="786" y="348" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">VIS[t] → instanceCount of EVERY bound</text>
  <text x="786" y="363" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">gid slot · firstInstance = 0</text>
  <text x="786" y="378" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle">pre-written tier-index buffers keep all</text>
  <text x="786" y="391" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle">tiers in the one phase</text>

  <rect x="28" y="446" width="450" height="50" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="253" y="466" font-family="monospace" font-size="11" font-weight="bold" fill="white" text-anchor="middle">cif_par params SSBO</text>
  <text x="253" y="483" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">host prefix (VP·eye·HZB·bound) + GPU-owned stat tail</text>

  <rect x="508" y="446" width="472" height="50" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="744" y="466" font-family="monospace" font-size="11" font-weight="bold" fill="white" text-anchor="middle">shadow twin — perViewShadow (once per frame)</text>
  <text x="744" y="483" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">union sun camera · occlusion OFF · single tier · own OUT buffers</text>

  <!-- cull phase -> culled outputs (straight drop through the note-box corridor) -->
  <line x1="499" y1="436" x2="499" y2="536" stroke="#666" marker-end="url(#arr)"/>

  <!-- ================= OUTPUT + DRAW ================= -->
  <text x="20" y="524" font-family="Arial" font-size="12" font-weight="bold" fill="#aaa">CULLED OUTPUT → ONE INDEXED-INDIRECT DRAW PER (TIER × BOUND GID)</text>

  <rect x="20" y="540" width="300" height="90" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="562" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">OUT_M / OUT_A — interleaved</text>
  <text x="170" y="580" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">tier t at [t·N, t·N + VIS[t])</text>
  <text x="170" y="595" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">sized tiers × N; tier slice via</text>
  <text x="170" y="610" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">graphics sub-range bind</text>

  <line x1="320" y1="585" x2="352" y2="585" stroke="#666" marker-end="url(#arr)"/>

  <rect x="354" y="540" width="290" height="90" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="499" y="562" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ARG[4096] indirect commands</text>
  <text x="499" y="580" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">one per gid slot:</text>
  <text x="499" y="595" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">indexCount ← triangulator,</text>
  <text x="499" y="610" font-family="monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">instanceCount ← cull (no CPU)</text>

  <line x1="644" y1="585" x2="676" y2="585" stroke="#666" marker-end="url(#arr)"/>

  <rect x="678" y="540" width="302" height="90" rx="8" fill="#4c1d95" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="829" y="560" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">indexed-indirect draws</text>
  <text x="829" y="578" font-family="monospace" font-size="10.5" fill="#c4b5fd" text-anchor="middle">FWD_SSBO_CUSTOM_INSTANCED: VS pulls</text>
  <text x="829" y="593" font-family="monospace" font-size="10.5" fill="#c4b5fd" text-anchor="middle">_instance_matrices[gl_InstanceIndex],</text>
  <text x="829" y="608" font-family="monospace" font-size="10.5" fill="#c4b5fd" text-anchor="middle">attrs → frg_clr; far tier →</text>
  <text x="829" y="623" font-family="monospace" font-size="10.5" fill="#c4b5fd" text-anchor="middle">impostor quad (hemi-oct atlas)</text>

  <text x="500" y="666" font-family="Arial" font-size="11.5" fill="#aaa" text-anchor="middle">the mesh is shared: one graph eval, one triangulation — N is invisible to the CPU draw path</text>
  <text x="500" y="684" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle">(sun-cascade depth passes re-bind the shadow OUT_M/OUT_A; LOD/impostor buckets skip shadow — tier 0 casts)</text>

  <!-- legend -->
  <rect x="20" y="742" width="14" height="14" rx="3" fill="#1e3a5f" stroke="#22d3ee"/>
  <text x="40" y="753" font-family="Arial" font-size="12" fill="#ddd">Python authoring</text>
  <rect x="180" y="742" width="14" height="14" rx="3" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="200" y="753" font-family="Arial" font-size="12" fill="#ddd">C++ / GPU data</text>
  <rect x="340" y="742" width="14" height="14" rx="3" fill="#1a3a3a" stroke="#34d399"/>
  <text x="360" y="753" font-family="Arial" font-size="12" fill="#ddd">GPU compute</text>
  <rect x="480" y="742" width="14" height="14" rx="3" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="500" y="753" font-family="Arial" font-size="12" fill="#ddd">render / draw</text>
  <rect x="620" y="742" width="14" height="14" rx="3" fill="#5a4a3a" stroke="#f59e0b"/>
  <text x="640" y="753" font-family="Arial" font-size="12" fill="#ddd">serialized artifact</text>
</svg>
