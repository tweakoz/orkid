<svg viewBox="0 0 850 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="850" height="550" fill="#1a1a2e"/>
  <text x="425" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">Hierarchical State Transition Algorithm</text>

  <!-- Step 1: Collect exit path -->
  <rect x="30" y="60" width="240" height="200" rx="8" fill="#252540" stroke="#4a4a6a"/>
  <text x="150" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">1. Collect Exit Path</text>
  <text x="150" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af">(current → root)</text>

  <rect x="50" y="120" width="80" height="30" rx="4" fill="#ef4444" stroke="#f87171"/>
  <text x="90" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="white">S2</text>
  <text x="145" y="140" font-family="Arial" font-size="10" fill="#9ca3af">← current</text>

  <rect x="50" y="160" width="80" height="30" rx="4" fill="#dc2626" stroke="#f87171"/>
  <text x="90" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="white">SA</text>

  <rect x="50" y="200" width="80" height="30" rx="4" fill="#b91c1c" stroke="#f87171"/>
  <text x="90" y="220" text-anchor="middle" font-family="monospace" font-size="11" fill="white">ROOT</text>

  <line x1="90" y1="150" x2="90" y2="155" stroke="#f87171" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="90" y1="190" x2="90" y2="195" stroke="#f87171" stroke-width="2" marker-end="url(#arr-red)"/>

  <text x="150" y="245" font-family="monospace" font-size="10" fill="#9ca3af">exit_vect = [S2, SA, ROOT]</text>

  <!-- Step 2: Collect enter path -->
  <rect x="305" y="60" width="240" height="200" rx="8" fill="#252540" stroke="#4a4a6a"/>
  <text x="425" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">2. Collect Enter Path</text>
  <text x="425" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af">(target → root)</text>

  <rect x="325" y="120" width="80" height="30" rx="4" fill="#22c55e" stroke="#4ade80"/>
  <text x="365" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="white">S3</text>
  <text x="420" y="140" font-family="Arial" font-size="10" fill="#9ca3af">← target</text>

  <rect x="325" y="160" width="80" height="30" rx="4" fill="#16a34a" stroke="#4ade80"/>
  <text x="365" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="white">SB</text>

  <rect x="325" y="200" width="80" height="30" rx="4" fill="#15803d" stroke="#4ade80"/>
  <text x="365" y="220" text-anchor="middle" font-family="monospace" font-size="11" fill="white">ROOT</text>

  <line x1="365" y1="150" x2="365" y2="155" stroke="#4ade80" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="365" y1="190" x2="365" y2="195" stroke="#4ade80" stroke-width="2" marker-end="url(#arr-green)"/>

  <text x="425" y="245" font-family="monospace" font-size="10" fill="#9ca3af">enter_vect = [S3, SB, ROOT]</text>

  <!-- Step 3: Find common ancestor -->
  <rect x="580" y="60" width="240" height="200" rx="8" fill="#252540" stroke="#4a4a6a"/>
  <text x="700" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">3. Filter Common</text>
  <text x="700" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af">(skip shared ancestors)</text>

  <rect x="600" y="125" width="160" height="35" rx="4" fill="#374151" stroke="#6b7280"/>
  <text x="680" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="white">ROOT is in both</text>

  <rect x="600" y="170" width="160" height="55" rx="4" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="680" y="192" text-anchor="middle" font-family="Arial" font-size="11" fill="#93c5fd">Don't exit ROOT</text>
  <text x="680" y="212" text-anchor="middle" font-family="Arial" font-size="11" fill="#93c5fd">Don't enter ROOT</text>

  <!-- Step 4: Execute -->
  <rect x="30" y="290" width="790" height="240" rx="8" fill="#252540" stroke="#4a4a6a"/>
  <text x="425" y="315" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">4. Execute Handlers (Exit leaf→root, Enter root→leaf)</text>

  <!-- Exit sequence -->
  <rect x="60" y="340" width="340" height="170" rx="6" fill="#1f2937" stroke="#ef4444"/>
  <text x="230" y="365" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ef4444">Exit Sequence (leaf to root)</text>

  <rect x="80" y="385" width="120" height="35" rx="4" fill="#ef4444"/>
  <text x="140" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="white">S2.onExit(inst)</text>
  <circle cx="130" cy="430" r="12" fill="#252540" stroke="#ef4444"/>
  <text x="130" y="434" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#ef4444">1</text>

  <line x1="180" y1="402" x2="200" y2="402" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="205" y="385" width="120" height="35" rx="4" fill="#dc2626"/>
  <text x="265" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="white">SA.onExit(inst)</text>
  <circle cx="255" cy="430" r="12" fill="#252540" stroke="#dc2626"/>
  <text x="255" y="434" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#dc2626">2</text>

  <rect x="80" y="460" width="300" height="30" rx="4" fill="#374151"/>
  <text x="230" y="480" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">ROOT.onExit() SKIPPED (common ancestor)</text>

  <!-- Enter sequence -->
  <rect x="450" y="340" width="340" height="170" rx="6" fill="#1f2937" stroke="#22c55e"/>
  <text x="620" y="365" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#22c55e">Enter Sequence (root to leaf)</text>

  <rect x="470" y="460" width="300" height="30" rx="4" fill="#374151"/>
  <text x="620" y="480" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">ROOT.onEnter() SKIPPED (common ancestor)</text>

  <rect x="470" y="385" width="120" height="35" rx="4" fill="#16a34a"/>
  <text x="530" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="white">SB.onEnter(inst)</text>
  <circle cx="525" cy="430" r="12" fill="#252540" stroke="#16a34a"/>
  <text x="525" y="434" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#16a34a">3</text>

  <line x1="580" y1="402" x2="600" y2="402" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="595" y="385" width="120" height="35" rx="4" fill="#22c55e"/>
  <text x="655" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="white">S3.onEnter(inst)</text>
  <circle cx="660" cy="430" r="12" fill="#252540" stroke="#22c55e"/>
  <text x="660" y="434" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#22c55e">4</text>
</svg>
