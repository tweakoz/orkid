<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="500" y="30" font-family="monospace" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Logger Configuration Flow</text>

  <!-- Priority Order -->
  <g id="priority">
    <rect x="50" y="55" width="900" height="40" rx="4" fill="#1a2a3a" stroke="#3a4a5a" stroke-width="1"/>
    <text x="500" y="80" font-family="monospace" font-size="11" fill="#8ff" text-anchor="middle">Priority Order: Programmatic (highest) > Environment Variable > NotCurses > Default Stdout (lowest)</text>
  </g>

  <!-- Logger Constructor -->
  <g id="constructor">
    <rect x="400" y="110" width="200" height="50" rx="8" fill="#2a3a2a" stroke="#4a5a4a" stroke-width="2"/>
    <text x="500" y="135" font-family="monospace" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Logger::Logger()</text>
    <text x="500" y="150" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">Startup initialization</text>
  </g>

  <!-- Check ORKID_LOG_DISABLE -->
  <g id="check-disable">
    <polygon points="500,180 600,230 500,280 400,230" fill="#3a2a2a" stroke="#5a4a4a" stroke-width="1"/>
    <text x="500" y="225" font-family="monospace" font-size="10" fill="white" text-anchor="middle">ORKID_LOG_DISABLE</text>
    <text x="500" y="240" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">set?</text>
  </g>

  <!-- NOP Backend -->
  <g id="nop-backend">
    <rect x="650" y="205" width="150" height="50" rx="6" fill="#3a1a1a" stroke="#5a3a3a" stroke-width="1"/>
    <text x="725" y="225" font-family="monospace" font-size="11" fill="#f88" text-anchor="middle">NOP Backend</text>
    <text x="725" y="242" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">All logging disabled</text>
  </g>

  <!-- Check ORKID_LOGGER_BACKEND -->
  <g id="check-backend-env">
    <polygon points="500,300 620,360 500,420 380,360" fill="#1a2a3a" stroke="#3a4a5a" stroke-width="1"/>
    <text x="500" y="350" font-family="monospace" font-size="10" fill="white" text-anchor="middle">ORKID_LOGGER_BACKEND</text>
    <text x="500" y="368" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">set?</text>
  </g>

  <!-- Parse Backend Spec -->
  <g id="parse-backend">
    <rect x="650" y="335" width="180" height="50" rx="6" fill="#1a3a2a" stroke="#3a5a4a" stroke-width="1"/>
    <text x="740" y="355" font-family="monospace" font-size="11" fill="#8f8" text-anchor="middle">parseBackendEnvVar()</text>
    <text x="740" y="372" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">Parse spec string</text>
  </g>

  <!-- Backend Types -->
  <g id="backend-types">
    <rect x="860" y="280" width="120" height="30" rx="4" fill="#1a2a1a" stroke="#3a4a3a" stroke-width="1"/>
    <text x="920" y="300" font-family="monospace" font-size="9" fill="#8f8" text-anchor="middle">STDOUT</text>

    <rect x="860" y="315" width="120" height="30" rx="4" fill="#2a1a1a" stroke="#4a3a3a" stroke-width="1"/>
    <text x="920" y="335" font-family="monospace" font-size="9" fill="#fa8" text-anchor="middle">FILE&lt;path&gt;</text>

    <rect x="860" y="350" width="120" height="30" rx="4" fill="#1a1a2a" stroke="#3a3a4a" stroke-width="1"/>
    <text x="920" y="370" font-family="monospace" font-size="9" fill="#c8f" text-anchor="middle">HTML&lt;path&gt;</text>

    <rect x="860" y="385" width="120" height="30" rx="4" fill="#1a2a2a" stroke="#3a4a4a" stroke-width="1"/>
    <text x="920" y="405" font-family="monospace" font-size="9" fill="#6c8" text-anchor="middle">HTTP&lt;uri&gt;</text>

    <rect x="860" y="420" width="120" height="30" rx="4" fill="#1a2a2a" stroke="#3a4a4a" stroke-width="1"/>
    <text x="920" y="440" font-family="monospace" font-size="9" fill="#8ff" text-anchor="middle">[A,B,C] Fork</text>
  </g>

  <!-- Check NotCurses -->
  <g id="check-notcurses">
    <polygon points="500,440 600,490 500,540 400,490" fill="#2a2a1a" stroke="#4a4a3a" stroke-width="1"/>
    <text x="500" y="483" font-family="monospace" font-size="10" fill="white" text-anchor="middle">ORKID_LOG_NOTCURSES</text>
    <text x="500" y="500" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">or --newlogger?</text>
  </g>

  <!-- NotCurses Backend -->
  <g id="notcurses-backend">
    <rect x="650" y="465" width="150" height="50" rx="6" fill="#2a2a1a" stroke="#4a4a3a" stroke-width="1"/>
    <text x="725" y="485" font-family="monospace" font-size="11" fill="#ff8" text-anchor="middle">NotCurses UI</text>
    <text x="725" y="502" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">TUI log viewer</text>
  </g>

  <!-- Default Stdout -->
  <g id="default-stdout">
    <rect x="400" y="560" width="200" height="50" rx="6" fill="#1a2a1a" stroke="#3a5a3a" stroke-width="2"/>
    <text x="500" y="582" font-family="monospace" font-size="11" fill="#8f8" text-anchor="middle" font-weight="bold">Default Stdout Backend</text>
    <text x="500" y="600" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">Colored console output</text>
  </g>

  <!-- Runtime Override -->
  <g id="runtime-override">
    <rect x="100" y="400" width="200" height="80" rx="6" fill="#1a1a3a" stroke="#3a3a5a" stroke-width="2"/>
    <text x="200" y="425" font-family="monospace" font-size="11" fill="#88f" text-anchor="middle" font-weight="bold">Programmatic Override</text>
    <text x="200" y="445" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">logger()->setBackend()</text>
    <text x="200" y="465" font-family="monospace" font-size="9" fill="#6a6" text-anchor="middle">Highest priority</text>
  </g>

  <!-- Active Backend -->
  <g id="active-backend">
    <rect x="100" y="520" width="200" height="70" rx="6" fill="#1a2a1a" stroke="#3a5a3a" stroke-width="2"/>
    <text x="200" y="545" font-family="monospace" font-size="12" fill="#8f8" text-anchor="middle" font-weight="bold">Active Backend</text>
    <text x="200" y="565" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">logger()->_backend</text>
    <text x="200" y="580" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">Used for all log calls</text>
  </g>

  <!-- Arrows -->
  <line x1="500" y1="160" x2="500" y2="180" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Disable check arrows -->
  <line x1="600" y1="230" x2="650" y2="230" stroke="#f88" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="620" y="220" font-family="monospace" font-size="9" fill="#f88">Yes</text>

  <line x1="500" y1="280" x2="500" y2="300" stroke="#8f8" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="515" y="295" font-family="monospace" font-size="9" fill="#8f8">No</text>

  <!-- Backend env check arrows -->
  <line x1="620" y1="360" x2="650" y2="360" stroke="#8f8" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="630" y="350" font-family="monospace" font-size="9" fill="#8f8">Yes</text>

  <line x1="830" y1="360" x2="860" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="500" y1="420" x2="500" y2="440" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="515" y="435" font-family="monospace" font-size="9" fill="#888">No</text>

  <!-- NotCurses check arrows -->
  <line x1="600" y1="490" x2="650" y2="490" stroke="#ff8" stroke-width="1.5" marker-end="url(#arrow-yellow)"/>
  <text x="620" y="480" font-family="monospace" font-size="9" fill="#ff8">Yes</text>

  <line x1="500" y1="540" x2="500" y2="560" stroke="#8f8" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="515" y="555" font-family="monospace" font-size="9" fill="#8f8">No</text>

  <!-- Override arrow -->
  <line x1="200" y1="480" x2="200" y2="520" stroke="#88f" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="175" y="505" font-family="monospace" font-size="9" fill="#88f">Anytime</text>

  <!-- Flow to active -->
  <line x1="400" y1="585" x2="300" y2="555" stroke="#8f8" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Env Var Examples Box -->
  <g id="env-examples">
    <rect x="50" y="110" width="320" height="210" rx="6" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <text x="210" y="135" font-family="monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Environment Variable Examples</text>

    <text x="70" y="160" font-family="monospace" font-size="8" fill="#8f8">ORKID_LOGGER_BACKEND=STDOUT</text>
    <text x="70" y="178" font-family="monospace" font-size="8" fill="#fa8">ORKID_LOGGER_BACKEND=FILE</text>
    <text x="70" y="196" font-family="monospace" font-size="8" fill="#fa8">ORKID_LOGGER_BACKEND=FILE&lt;/tmp/log&gt;</text>
    <text x="70" y="214" font-family="monospace" font-size="8" fill="#c8f">ORKID_LOGGER_BACKEND=HTML</text>
    <text x="70" y="232" font-family="monospace" font-size="8" fill="#6c8">ORKID_LOGGER_BACKEND=HTTP</text>
    <text x="70" y="250" font-family="monospace" font-size="8" fill="#6c8">ORKID_LOGGER_BACKEND=HTTP&lt;tcp://host:12288&gt;</text>
    <text x="70" y="268" font-family="monospace" font-size="8" fill="#8ff">ORKID_LOGGER_BACKEND=[STDOUT,FILE]</text>
    <text x="70" y="286" font-family="monospace" font-size="8" fill="#8ff">ORKID_LOGGER_BACKEND=[STDOUT,HTTP]</text>
    <text x="70" y="304" font-family="monospace" font-size="8" fill="#666">ORKID_LOGGER_FILE_ANSI=1</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8f8"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f88"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#88f"/>
    </marker>
  </defs>
</svg>
