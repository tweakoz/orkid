<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#3a3a3a"/>

  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">StandardSceneGraphComponent Rendering FrameGraph</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a8"/>
    </marker>
  </defs>

  <!-- Update Thread Column -->
  <g id="update-thread">
    <rect x="30" y="60" width="280" height="200" rx="8" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
    <text x="170" y="85" font-family="Arial, sans-serif" font-size="14" fill="#f88" text-anchor="middle" font-weight="bold">Update Thread</text>

    <rect x="50" y="105" width="240" height="40" rx="4" fill="#4a3a5a" stroke="#6a5a7a" stroke-width="1"/>
    <text x="170" y="130" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">scene.updateScene(cameralut)</text>

    <rect x="50" y="155" width="240" height="40" rx="4" fill="#4a3a5a" stroke="#6a5a7a" stroke-width="1"/>
    <text x="170" y="175" font-family="Arial, sans-serif" font-size="10" fill="#ddd" text-anchor="middle">Enqueue drawables to DrawQueue</text>
    <text x="170" y="188" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">(double-buffered)</text>

    <rect x="50" y="205" width="240" height="35" rx="4" fill="#3a4a3a" stroke="#5a6a5a" stroke-width="1"/>
    <text x="170" y="228" font-family="Arial, sans-serif" font-size="10" fill="#8f8" text-anchor="middle">SGVP.setDirty()</text>
  </g>

  <!-- Main/GPU Thread Column -->
  <g id="gpu-thread">
    <rect x="340" y="60" width="830" height="820" rx="8" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
    <text x="755" y="85" font-family="Arial, sans-serif" font-size="14" fill="#8f8" text-anchor="middle" font-weight="bold">Main/GPU Thread - Per Frame Rendering</text>

    <!-- SceneGraphViewport -->
    <rect x="360" y="105" width="790" height="100" rx="6" fill="#3a4a5a" stroke="#5a6a8a" stroke-width="1"/>
    <text x="755" y="125" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">SceneGraphViewport::DoRePaintSurface()</text>
    <text x="755" y="145" font-family="Arial, sans-serif" font-size="10" fill="#ddd" text-anchor="middle">Acquire DrawQueue → Configure CompositorImpl → Call _renderWithAcquiredDrawQueueForRendering()</text>

    <rect x="380" y="160" width="180" height="35" rx="4" fill="#2a3a4a" stroke="#4a5a6a" stroke-width="1"/>
    <text x="470" y="182" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Output: RtGroupOutputNode</text>

    <rect x="580" y="160" width="180" height="35" rx="4" fill="#2a3a4a" stroke="#4a5a6a" stroke-width="1"/>
    <text x="670" y="182" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Render: ForwardPBR Node</text>

    <rect x="780" y="160" width="180" height="35" rx="4" fill="#2a3a4a" stroke="#4a5a6a" stroke-width="1"/>
    <text x="870" y="182" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">PostFx: Optional Chain</text>

    <!-- Compositor Pipeline -->
    <rect x="360" y="220" width="790" height="510" rx="6" fill="#3a3a4a" stroke="#5a5a7a" stroke-width="1"/>
    <text x="755" y="245" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">NodeCompositingTechnique Pipeline</text>

    <!-- Assemble Phase -->
    <rect x="380" y="260" width="750" height="200" rx="4" fill="#4a4a3a" stroke="#6a6a5a" stroke-width="1"/>
    <text x="755" y="280" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">ASSEMBLE PHASE</text>

    <!-- Render Node -->
    <rect x="400" y="295" width="350" height="150" rx="4" fill="#5a3a3a" stroke="#8a5a5a" stroke-width="1"/>
    <text x="575" y="315" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">ForwardNode::DoRender()</text>

    <rect x="415" y="325" width="150" height="25" rx="3" fill="#4a2a2a" stroke="#6a4a4a" stroke-width="1"/>
    <text x="490" y="342" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">1. Shadow Maps</text>

    <rect x="580" y="325" width="150" height="25" rx="3" fill="#4a2a2a" stroke="#6a4a4a" stroke-width="1"/>
    <text x="655" y="342" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">2. Env Probes</text>

    <rect x="415" y="358" width="150" height="25" rx="3" fill="#4a2a2a" stroke="#6a4a4a" stroke-width="1"/>
    <text x="490" y="375" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">3. Depth Prepass</text>

    <rect x="580" y="358" width="150" height="25" rx="3" fill="#4a2a2a" stroke="#6a4a4a" stroke-width="1"/>
    <text x="655" y="375" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">4. SSAO</text>

    <rect x="415" y="391" width="150" height="25" rx="3" fill="#4a2a2a" stroke="#6a4a4a" stroke-width="1"/>
    <text x="490" y="408" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">5. Skybox</text>

    <rect x="580" y="391" width="150" height="25" rx="3" fill="#5a2a2a" stroke="#8a4a4a" stroke-width="1"/>
    <text x="655" y="408" font-family="Arial, sans-serif" font-size="9" fill="#ff8" text-anchor="middle">6. Color Pass (PBR)</text>

    <text x="575" y="435" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">Output → _rtg_primary (RTGroup)</text>

    <!-- PostFx Chain -->
    <rect x="770" y="295" width="340" height="150" rx="4" fill="#3a5a3a" stroke="#5a7a5a" stroke-width="1"/>
    <text x="940" y="315" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">PostFx Chain (Optional)</text>

    <rect x="785" y="330" width="150" height="25" rx="3" fill="#2a4a2a" stroke="#4a6a4a" stroke-width="1"/>
    <text x="860" y="347" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">PostFxNode[0].Render()</text>

    <rect x="785" y="363" width="150" height="25" rx="3" fill="#2a4a2a" stroke="#4a6a4a" stroke-width="1"/>
    <text x="860" y="380" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">PostFxNode[1].Render()</text>

    <rect x="785" y="396" width="150" height="25" rx="3" fill="#2a4a2a" stroke="#4a6a4a" stroke-width="1"/>
    <text x="860" y="413" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">PostFxNode[N].Render()</text>

    <text x="940" y="435" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">Each node: in RTG → custom shader → out RTG</text>

    <!-- Arrow from Render to PostFx -->
    <path d="M 750 370 L 780 370" stroke="#4a8" stroke-width="2" marker-end="url(#arrowhead-green)"/>
    <text x="765" y="365" font-family="Arial, sans-serif" font-size="8" fill="#4a8">render_out</text>

    <!-- Composite Phase -->
    <rect x="380" y="475" width="750" height="100" rx="4" fill="#3a4a5a" stroke="#5a6a8a" stroke-width="1"/>
    <text x="755" y="495" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">COMPOSITE PHASE</text>

    <rect x="400" y="510" width="350" height="50" rx="4" fill="#2a3a4a" stroke="#4a5a6a" stroke-width="1"/>
    <text x="575" y="530" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">RtGroupOutputCompositingNode::composite()</text>
    <text x="575" y="548" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">blit.fxv2 "blit" technique → _rtgroup</text>

    <rect x="770" y="510" width="340" height="50" rx="4" fill="#2a3a4a" stroke="#4a5a6a" stroke-width="1"/>
    <text x="940" y="530" font-family="Arial, sans-serif" font-size="10" fill="#8f8" text-anchor="middle">final_out = last PostFx RTGroup</text>
    <text x="940" y="548" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">(or render_out if no PostFx)</text>

    <!-- UI Surface Blit -->
    <rect x="380" y="590" width="750" height="120" rx="4" fill="#5a4a3a" stroke="#8a6a5a" stroke-width="1"/>
    <text x="755" y="615" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">UI SURFACE BLIT (Inherited from Surface)</text>

    <rect x="400" y="630" width="350" height="65" rx="4" fill="#4a3a2a" stroke="#6a5a4a" stroke-width="1"/>
    <text x="575" y="650" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Surface::DoDraw()</text>
    <text x="575" y="668" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">GfxMaterialUITextured(_rtgroup.texture)</text>
    <text x="575" y="685" font-family="Arial, sans-serif" font-size="9" fill="#ff8" text-anchor="middle">ui.fxv2 "uitextured" technique</text>

    <rect x="770" y="630" width="340" height="65" rx="4" fill="#4a3a2a" stroke="#6a5a4a" stroke-width="1"/>
    <text x="940" y="655" font-family="Arial, sans-serif" font-size="10" fill="#8f8" text-anchor="middle">Blits viewport RTGroup to screen</text>
    <text x="940" y="680" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Final quad render to swapchain</text>
  </g>

  <!-- Flow arrows -->
  <path d="M 310 170 L 355 170" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="333" y="165" font-family="Arial, sans-serif" font-size="8" fill="#aaa">DrawQueue</text>

  <!-- Legend -->
  <rect x="30" y="800" width="280" height="80" rx="6" fill="#2a2a2a" stroke="#666" stroke-width="1"/>
  <text x="170" y="820" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Legend</text>
  <rect x="45" y="835" width="12" height="12" fill="#5a3a3a"/>
  <text x="65" y="845" font-family="Arial, sans-serif" font-size="9" fill="#ddd">3D Render Pass</text>
  <rect x="145" y="835" width="12" height="12" fill="#3a5a3a"/>
  <text x="165" y="845" font-family="Arial, sans-serif" font-size="9" fill="#ddd">PostFx Pass</text>
  <rect x="235" y="835" width="12" height="12" fill="#5a4a3a"/>
  <text x="255" y="845" font-family="Arial, sans-serif" font-size="9" fill="#ddd">UI Blit</text>
  <rect x="45" y="855" width="12" height="12" fill="#3a4a5a"/>
  <text x="65" y="865" font-family="Arial, sans-serif" font-size="9" fill="#ddd">Compositor</text>
</svg>
