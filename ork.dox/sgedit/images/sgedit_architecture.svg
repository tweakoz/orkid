  <rect x="50" y="350" width="120" height="30" rx="4" fill="#6a4a80" stroke="#8a6aa0"/>
  <text x="110" y="370" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">DrawableNodes</text>

  <rect x="190" y="350" width="120" height="30" rx="4" fill="#6a4a80" stroke="#8a6aa0"/>
  <text x="250" y="370" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">LightNodes</text>

  <rect x="330" y="350" width="120" height="30" rx="4" fill="#6a4a80" stroke="#8a6aa0"/>
  <text x="390" y="370" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">ParticleNodes</text>

  <rect x="470" y="350" width="120" height="30" rx="4" fill="#6a4a80" stroke="#8a6aa0"/>
  <text x="530" y="370" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">Transforms</text>

  <rect x="610" y="350" width="140" height="30" rx="4" fill="#6a4a80" stroke="#8a6aa0"/>
  <text x="680" y="370" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">LightingManager</text>

  <!-- Persistence Layer -->
  <rect x="30" y="410" width="740" height="70" rx="8" fill="#2d3d44" stroke="#4a5d6a" stroke-width="2"/>
  <text x="50" y="435" fill="#a8d4d4" font-family="sans-serif" font-size="12" font-weight="bold">PERSISTENCE</text>

  <rect x="50" y="450" width="150" height="25" rx="4" fill="#3d5a6a" stroke="#5d7a8a"/>
  <text x="125" y="467" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">.osgr (JSON)</text>

  <rect x="220" y="450" width="150" height="25" rx="4" fill="#3d5a6a" stroke="#5d7a8a"/>
  <text x="295" y="467" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">.gltf / .glb Models</text>

  <rect x="390" y="450" width="150" height="25" rx="4" fill="#3d5a6a" stroke="#5d7a8a"/>
  <text x="465" y="467" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="10">Textures</text>

  <!-- Arrows -->
  <line x1="100" y1="270" x2="100" y2="345" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="220" y1="270" x2="220" y2="345" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="340" y1="270" x2="250" y2="345" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="460" y1="270" x2="390" y2="345" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="580" y1="270" x2="390" y2="345" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="700" y1="270" x2="530" y2="345" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- Legend -->
  <rect x="560" y="100" width="190" height="30" rx="4" fill="#2d2d44" stroke="#4a4a6a"/>
  <text x="580" y="120" fill="#a8d4ff" font-family="sans-serif" font-size="10">MVC: Scenegraph = Model</text>

</svg>
