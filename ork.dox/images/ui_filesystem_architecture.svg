<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#357abd"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>

  <!-- FilesystemBrowser Box -->
  <rect x="20" y="20" width="760" height="240" rx="8" fill="url(#boxGrad)" stroke="#357abd" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="30" rx="8" fill="url(#headerGrad)"/>
  <rect x="20" y="42" width="760" height="8" fill="url(#headerGrad)"/>
  <text x="400" y="42" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold" font-size="14">FilesystemBrowser (Python Composite)</text>

  <!-- Toolbar -->
  <rect x="40" y="60" width="720" height="35" rx="4" fill="#2d3748" stroke="#4a5568"/>
  <text x="50" y="82" fill="#e2e8f0" font-family="monospace" font-size="11">[Home][Parent][Refresh] | [List][Icon] | [Hidden] | [+Fav] | [+Size][-Size]</text>

  <!-- Filter Bar -->
  <rect x="40" y="100" width="720" height="30" rx="4" fill="#1a202c" stroke="#4a5568"/>
  <text x="50" y="120" fill="#a0aec0" font-family="Arial" font-size="11">Filter:</text>
  <rect x="100" y="105" width="540" height="20" rx="2" fill="#2d3748"/>
  <rect x="650" y="105" width="45" height="20" rx="2" fill="#2f855a"/>
  <text x="672" y="119" text-anchor="middle" fill="white" font-family="Arial" font-size="9">HOLD</text>
  <rect x="700" y="105" width="45" height="20" rx="2" fill="#c53030"/>
  <text x="722" y="119" text-anchor="middle" fill="white" font-family="Arial" font-size="9">CLR</text>

  <!-- Content Area -->
  <rect x="40" y="135" width="150" height="115" rx="4" fill="#1a202c" stroke="#4a5568"/>
  <text x="115" y="152" text-anchor="middle" fill="#a0aec0" font-family="Arial" font-size="10">Favorites Panel</text>
  <rect x="50" y="160" width="130" height="20" rx="2" fill="#2d3748"/>
  <text x="115" y="174" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="9">Projects [X][->]</text>
  <rect x="50" y="185" width="130" height="20" rx="2" fill="#2d3748"/>
  <text x="115" y="199" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="9">Downloads [X][->]</text>

  <!-- FilesystemView -->
  <rect x="200" y="135" width="560" height="115" rx="4" fill="#1a202c" stroke="#4a5568"/>
  <text x="210" y="152" fill="#63b3ed" font-family="Arial" font-weight="bold" font-size="10">FilesystemView (C++)</text>
  <line x1="200" y1="158" x2="760" y2="158" stroke="#4a5568"/>
  <text x="210" y="172" fill="#a0aec0" font-family="monospace" font-size="9">Name            Size      Type        Modified</text>
  <line x1="200" y1="178" x2="760" y2="178" stroke="#4a5568" stroke-dasharray="2"/>
  <text x="210" y="192" fill="#90cdf4" font-family="monospace" font-size="9">src/            -         Directory   2024-01-15</text>
  <text x="210" y="206" fill="#90cdf4" font-family="monospace" font-size="9">docs/           -         Directory   2024-01-10</text>
  <text x="210" y="220" fill="#e2e8f0" font-family="monospace" font-size="9">main.cpp        8.1 KB    C++ Source  2024-01-14</text>
  <text x="210" y="234" fill="#e2e8f0" font-family="monospace" font-size="9">README.md       2.4 KB    Markdown    2024-01-12</text>

  <!-- Arrow to Model -->
  <line x1="400" y1="260" x2="400" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="280" fill="#666" font-family="Arial" font-size="10">uses</text>

  <!-- FilesystemModel Box -->
  <rect x="100" y="300" width="600" height="140" rx="8" fill="url(#boxGrad)" stroke="#38a169" stroke-width="2"/>
  <rect x="100" y="300" width="600" height="30" rx="8" fill="#38a169"/>
  <rect x="100" y="322" width="600" height="8" fill="#38a169"/>
  <text x="400" y="322" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold" font-size="14">FilesystemModel (Abstract Base)</text>

  <text x="120" y="355" fill="#2d3e50" font-family="monospace" font-size="10">Navigation: getCurrentPath(), setCurrentPath(), getParentPath()</text>
  <text x="120" y="372" fill="#2d3e50" font-family="monospace" font-size="10">Enumeration: getEntries(), getEntry(), getDisplayName()</text>
  <text x="120" y="389" fill="#2d3e50" font-family="monospace" font-size="10">Filtering: setFilter(), setNameFilter(), setShowHidden()</text>
  <text x="120" y="406" fill="#2d3e50" font-family="monospace" font-size="10">Sorting: setSortField(), setSortOrder(), setDirectoriesFirst()</text>
  <text x="120" y="423" fill="#2d3e50" font-family="monospace" font-size="10">Operations: createDirectory(), deleteItem(), renameItem()</text>

  <!-- LocalFilesystemModel -->
  <rect x="200" y="460" width="400" height="60" rx="6" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="400" y="485" text-anchor="middle" fill="#22543d" font-family="Arial" font-weight="bold" font-size="12">LocalFilesystemModel</text>
  <text x="400" y="505" text-anchor="middle" fill="#276749" font-family="Arial" font-size="10">Real filesystem access, thumbnails, read/write ops</text>

  <!-- Inheritance arrow -->
  <line x1="400" y1="440" x2="400" y2="460" stroke="#38a169" stroke-width="2"/>
  <polygon points="390,455 400,440 410,455" fill="#38a169"/>
  <text x="420" y="452" fill="#38a169" font-family="Arial" font-size="9">implements</text>

  <!-- Arrow to FavoritesManager -->
  <line x1="400" y1="520" x2="400" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="540" fill="#666" font-family="Arial" font-size="10">persisted by</text>

  <!-- FavoritesManager Box -->
  <rect x="150" y="560" width="500" height="80" rx="8" fill="url(#boxGrad)" stroke="#805ad5" stroke-width="2"/>
  <rect x="150" y="560" width="500" height="30" rx="8" fill="#805ad5"/>
  <rect x="150" y="582" width="500" height="8" fill="#805ad5"/>
  <text x="400" y="582" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold" font-size="14">FavoritesManager</text>

  <text x="170" y="610" fill="#2d3e50" font-family="monospace" font-size="10">FavoriteEntry: uuid, path, name, name_filter, sort_field, sort_order</text>
  <text x="170" y="627" fill="#666" font-family="Arial" font-size="10">Storage: ~/.orkid/favorites.json (namespaced by model_id)</text>
</svg>
