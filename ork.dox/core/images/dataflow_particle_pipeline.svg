<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="410" fill="#1a1a2e"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="white">Particle graph pipeline — the particle-buffer chain</text>
  <text x="30" y="54" font-size="12" fill="#9ca3af">every module is a serialized DgModuleData subclass (blue); the buffer plug hands the live pool down the chain</text>

  <rect x="30" y="80" width="205" height="128" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="80" width="205" height="30" rx="8" fill="#2563eb"/>
  <text x="44" y="104" font-size="12.5" font-weight="bold" font-family="monospace" fill="white">ParticlePoolData</text>
  <text x="44" y="126" font-size="11" font-family="monospace" fill="#93c5fd">source — owns the pool</text>
  <text x="44" y="142" font-size="11" font-family="monospace" fill="#93c5fd">pool_size (default 16384)</text>
  <text x="44" y="158" font-size="11" font-family="monospace" fill="#93c5fd">aging · death · recycling</text>

  <rect x="280" y="80" width="205" height="128" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="80" width="205" height="30" rx="8" fill="#2563eb"/>
  <text x="294" y="104" font-size="12.5" font-weight="bold" font-family="monospace" fill="white">Emitters</text>
  <text x="294" y="126" font-size="11" font-family="monospace" fill="#93c5fd">Ring · Nozzle</text>
  <text x="294" y="142" font-size="11" font-family="monospace" fill="#93c5fd">Line · Elliptical</text>
  <text x="294" y="158" font-size="11" font-family="monospace" fill="#93c5fd">spawn into the pool</text>
  <text x="294" y="174" font-size="11" font-family="monospace" fill="#93c5fd">(pass-through)</text>

  <rect x="530" y="80" width="215" height="128" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="530" y="80" width="215" height="30" rx="8" fill="#2563eb"/>
  <text x="544" y="104" font-size="12.5" font-weight="bold" font-family="monospace" fill="white">Forces &amp; Colliders</text>
  <text x="544" y="126" font-size="11" font-family="monospace" fill="#93c5fd">Gravity · Directional · Expr</text>
  <text x="544" y="142" font-size="11" font-family="monospace" fill="#93c5fd">Turbulence · Curl · Vortex</text>
  <text x="544" y="158" font-size="11" font-family="monospace" fill="#93c5fd">Drag · PolyDrag · Attractors</text>
  <text x="544" y="174" font-size="11" font-family="monospace" fill="#93c5fd">Plane/Sphere/Vdb colliders</text>

  <rect x="790" y="80" width="180" height="128" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="790" y="80" width="180" height="30" rx="8" fill="#2563eb"/>
  <text x="804" y="104" font-size="12.5" font-weight="bold" font-family="monospace" fill="white">Renderers</text>
  <text x="804" y="126" font-size="11" font-family="monospace" fill="#93c5fd">Sprite · Streak</text>
  <text x="804" y="142" font-size="11" font-family="monospace" fill="#93c5fd">Light · VdbLevelSet</text>
  <text x="804" y="158" font-size="11" font-family="monospace" fill="#93c5fd">terminal — enqueue</text>
  <text x="804" y="174" font-size="11" font-family="monospace" fill="#93c5fd">draw calls</text>

  <line x1="239" y1="144" x2="276" y2="144" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="489" y1="144" x2="526" y2="144" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="749" y1="144" x2="786" y2="144" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrB)"/>

  <text x="500" y="240" font-size="11" font-family="monospace" fill="#60a5fa" text-anchor="middle">pool plug → pool plug : ParticleBufferPlugTraits (max_fanout = 1 — single consumer per output)</text>

  <line x1="880" y1="208" x2="880" y2="266" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="280" y="270" width="690" height="110" rx="10" fill="#252540" stroke="#4a5568" stroke-width="2" filter="url(#shadow)"/>
  <text x="294" y="294" font-size="13" font-weight="bold" fill="white">materials (pluggable Data, on renderers)</text>
  <rect x="294" y="308" width="52" height="24" rx="5" fill="#374151" stroke="#6b7280"/>
  <text x="320" y="324" font-size="11" font-family="monospace" fill="white" text-anchor="middle">Flat</text>
  <rect x="356" y="308" width="78" height="24" rx="5" fill="#374151" stroke="#6b7280"/>
  <text x="395" y="324" font-size="11" font-family="monospace" fill="white" text-anchor="middle">Gradient</text>
  <rect x="444" y="308" width="110" height="24" rx="5" fill="#374151" stroke="#6b7280"/>
  <text x="499" y="324" font-size="11" font-family="monospace" fill="white" text-anchor="middle">GradientAtlas</text>
  <rect x="564" y="308" width="72" height="24" rx="5" fill="#374151" stroke="#6b7280"/>
  <text x="600" y="324" font-size="11" font-family="monospace" fill="white" text-anchor="middle">Texture</text>
  <rect x="646" y="308" width="72" height="24" rx="5" fill="#374151" stroke="#6b7280"/>
  <text x="682" y="324" font-size="11" font-family="monospace" fill="white" text-anchor="middle">TexGrid</text>
  <rect x="294" y="340" width="64" height="24" rx="5" fill="#374151" stroke="#6b7280"/>
  <text x="326" y="356" font-size="11" font-family="monospace" fill="white" text-anchor="middle">VolTex</text>
  <rect x="368" y="340" width="130" height="24" rx="5" fill="#374151" stroke="#6b7280"/>
  <text x="433" y="356" font-size="11" font-family="monospace" fill="white" text-anchor="middle">FreestyleParticle</text>
</svg>
