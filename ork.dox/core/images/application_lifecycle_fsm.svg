<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#3a3a3a"/>

  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Application Lifecycle State Machine - Multi-Thread View</text>

  <!-- Thread Lanes -->
  <!-- Python Main Thread Lane -->
  <rect x="50" y="70" width="320" height="780" rx="4" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  <text x="210" y="95" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Python Main Thread</text>
  <text x="210" y="110" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">[GIL HELD]</text>

  <!-- C++ Main/GPU Thread Lane -->
  <rect x="390" y="70" width="320" height="780" rx="4" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  <text x="550" y="95" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">C++ Main/GPU Thread</text>
  <text x="550" y="110" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">[GIL per callback]</text>

  <!-- C++ Update Thread Lane -->
  <rect x="730" y="70" width="320" height="780" rx="4" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  <text x="890" y="95" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">C++ Update Thread</text>
  <text x="890" y="110" font-family="Arial, sans-serif" font-size="9" fill="#f88" text-anchor="middle">[GIL per callback]</text>

  <!-- C++ Audio/Synth Threads Lane -->
  <rect x="1070" y="70" width="280" height="780" rx="4" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  <text x="1210" y="95" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Audio/Synth Threads</text>
  <text x="1210" y="110" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">[No GIL needed]</text>

  <!-- Timeline markers -->
  <text x="20" y="150" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="end">t=0</text>
  <line x1="30" y1="145" x2="1370" y2="145" stroke="#444" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Initial State -->
  <circle cx="210" cy="160" r="15" fill="#000" stroke="#888" stroke-width="2"/>

  <!-- 1. CONSTRUCTING -->
  <rect x="90" y="190" width="240" height="55" rx="6" fill="#5a4a3a" stroke="#8a6a4a" stroke-width="2"/>
  <text x="210" y="213" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">CONSTRUCTING</text>
  <text x="210" y="228" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">__init__(), addComponent()</text>

  <!-- 2. EZAPP_CREATING -->
  <rect x="90" y="260" width="240" height="55" rx="6" fill="#5a4a3a" stroke="#8a6a4a" stroke-width="2"/>
  <text x="210" y="283" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">EZAPP_CREATING</text>
  <text x="210" y="298" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">createEzApp(), onEzAppCreated()</text>

  <!-- 3. UI_READY -->
  <rect x="90" y="330" width="240" height="55" rx="6" fill="#5a4a3a" stroke="#8a6a4a" stroke-width="2"/>
  <text x="210" y="353" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">UI_READY</text>
  <text x="210" y="368" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">_onUiInit() - UI created</text>

  <!-- Transfer to C++ -->
  <path d="M 330 357 L 410 410" stroke="#f88" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <text x="370" y="380" font-family="Arial, sans-serif" font-size="9" fill="#f88" text-anchor="middle" font-weight="bold">mainThreadLoop()</text>
  <text x="370" y="393" font-family="Arial, sans-serif" font-size="8" fill="#f88" text-anchor="middle">GIL released</text>

  <!-- 4. APP_INIT -->
  <rect x="410" y="405" width="260" height="55" rx="6" fill="#3a4a5a" stroke="#5a6a8a" stroke-width="2"/>
  <text x="540" y="428" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">APP_INIT</text>
  <text x="540" y="443" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onAppInit() → onAppLink()</text>

  <!-- 5. AUDIO_INIT -->
  <rect x="410" y="475" width="260" height="55" rx="6" fill="#5a5a3a" stroke="#7a7a5a" stroke-width="2"/>
  <text x="540" y="498" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">AUDIO_INIT</text>
  <text x="540" y="513" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onSynthInit() → onAudioInit()</text>

  <!-- Audio threads spawn -->
  <path d="M 670 502 L 1090 502" stroke="#f88" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="880" y="497" font-family="Arial, sans-serif" font-size="8" fill="#f88" text-anchor="middle">spawn</text>

  <!-- 6. GPU_INIT -->
  <rect x="410" y="545" width="260" height="55" rx="6" fill="#4a3a5a" stroke="#6a5a7a" stroke-width="2"/>
  <text x="540" y="568" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">GPU_INIT</text>
  <text x="540" y="583" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onGpuInit() → onGpuLink()</text>

  <!-- Update thread spawn -->
  <path d="M 670 572 L 750 615" stroke="#f88" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="710" y="555" font-family="Arial, sans-serif" font-size="8" fill="#f88" text-anchor="middle">spawn after GPU init</text>

  <!-- 7. UPDATE_INIT -->
  <rect x="750" y="610" width="260" height="55" rx="6" fill="#5a4a5a" stroke="#7a6a7a" stroke-width="2"/>
  <text x="880" y="633" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">UPDATE_INIT</text>
  <text x="880" y="648" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onUpdateInit() → onUpdateLink()</text>

  <!-- RUNNING PHASE SEPARATOR -->
  <text x="20" y="700" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="end">LOOP</text>
  <line x1="30" y1="695" x2="1370" y2="695" stroke="#8f8" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- 8. RUNNING - Main Thread -->
  <ellipse cx="540" cy="735" rx="120" ry="40" fill="#4a5a4a" stroke="#6a7a6a" stroke-width="3"/>
  <text x="540" y="730" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">RUNNING</text>
  <text x="540" y="746" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">onGpuUpdate()</text>

  <!-- 8. RUNNING - Update Thread -->
  <ellipse cx="880" cy="735" rx="120" ry="40" fill="#4a5a4a" stroke="#6a7a6a" stroke-width="3"/>
  <text x="880" y="730" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">RUNNING</text>
  <text x="880" y="746" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">onUpdate()</text>

  <!-- 8. RUNNING - Audio Thread -->
  <ellipse cx="1210" cy="640" rx="100" ry="80" fill="#4a5a4a" stroke="#6a7a6a" stroke-width="3"/>
  <text x="1210" y="633" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">RUNNING</text>
  <text x="1210" y="651" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">Audio Loop</text>
  <text x="1210" y="666" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">Synth Loop</text>

  <!-- Loop backs -->
  <path d="M 420 735 C 380 735 380 735 420 735" stroke="#8f8" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <path d="M 760 735 C 720 735 720 735 760 735" stroke="#8f8" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <path d="M 1110 640 C 1070 640 1070 640 1110 640" stroke="#8f8" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>

  <!-- Parallel execution marker -->
  <text x="710" y="760" font-family="Arial, sans-serif" font-size="10" fill="#8f8" text-anchor="middle">← Parallel Execution →</text>

  <!-- SHUTDOWN PHASE SEPARATOR -->
  <text x="20" y="795" font-family="Arial, sans-serif" font-size="9" fill="#f88" text-anchor="end">EXIT</text>
  <line x1="30" y1="790" x2="1370" y2="790" stroke="#f88" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="710" y="810" font-family="Arial, sans-serif" font-size="10" fill="#f88" text-anchor="middle" font-weight="bold">signalExit() or window close</text>

  <!-- 9. UPDATE_EXIT -->
  <rect x="750" y="815" width="260" height="55" rx="6" fill="#5a3a3a" stroke="#8a5a5a" stroke-width="2"/>
  <text x="880" y="838" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">UPDATE_EXIT</text>
  <text x="880" y="853" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onUpdateExit()</text>

  <!-- 10. AUDIO_EXIT (in Update thread context) -->
  <rect x="1090" y="745" width="240" height="55" rx="6" fill="#5a3a3a" stroke="#8a5a5a" stroke-width="2"/>
  <text x="1210" y="768" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">AUDIO_EXIT</text>
  <text x="1210" y="783" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onAudioExit(), onSynthExit()</text>

  <!-- Audio exit called from update thread -->
  <path d="M 880 870 L 1180 800" stroke="#888" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="1030" y="830" font-family="Arial, sans-serif" font-size="8" fill="#aaa" text-anchor="middle">called from</text>
  <text x="1030" y="843" font-family="Arial, sans-serif" font-size="8" fill="#aaa" text-anchor="middle">update thread</text>

  <!-- Thread join -->
  <path d="M 750 843 L 670 843" stroke="#f88" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <text x="710" y="838" font-family="Arial, sans-serif" font-size="8" fill="#f88" text-anchor="middle">joinUpdate()</text>

  <!-- 11. GPU_EXIT -->
  <rect x="410" y="815" width="260" height="55" rx="6" fill="#5a3a3a" stroke="#8a5a5a" stroke-width="2"/>
  <text x="540" y="838" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">GPU_EXIT</text>
  <text x="540" y="853" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onGpuExit()</text>

  <!-- Return to Python -->
  <path d="M 410 843 L 350 843" stroke="#f88" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <text x="380" y="838" font-family="Arial, sans-serif" font-size="8" fill="#f88" text-anchor="middle">return from</text>
  <text x="380" y="851" font-family="Arial, sans-serif" font-size="8" fill="#f88" text-anchor="middle">mainThreadLoop()</text>

  <!-- 12. APP_EXIT -->
  <rect x="90" y="815" width="240" height="55" rx="6" fill="#5a3a3a" stroke="#8a5a5a" stroke-width="2"/>
  <text x="210" y="838" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">APP_EXIT</text>
  <text x="210" y="853" font-family="Arial, sans-serif" font-size="9" fill="#ddd" text-anchor="middle">onAppExit()</text>

  <!-- Final State -->
  <circle cx="210" cy="820" r="15" fill="#000" stroke="#888" stroke-width="2"/>
  <circle cx="210" cy="820" r="10" fill="#888"/>

  <!-- Sequential flow arrows -->
  <path d="M 210 175 L 210 190" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 210 245 L 210 260" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 210 315 L 210 330" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 460 L 540 475" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 530 L 540 545" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 880 665 L 880 695" stroke="#8f8" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <path d="M 540 600 L 540 695" stroke="#8f8" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <path d="M 880 775 L 880 815" stroke="#f88" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <path d="M 540 775 L 540 815" stroke="#f88" stroke-width="2" marker-end="url(#arrowhead-red)"/>

  <!-- Key insight -->
  <rect x="50" y="40" width="700" height="20" rx="4" fill="#5a5a3a" stroke="#7a7a5a" stroke-width="1"/>
  <text x="400" y="53" font-family="Arial, sans-serif" font-size="9" fill="#8f8" text-anchor="middle">Python Setup → C++ Init (sequential) → Parallel Loop → Ordered Shutdown</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8f8"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f88"/>
    </marker>
  </defs>
</svg>
