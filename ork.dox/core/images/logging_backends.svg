<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="600" y="30" font-family="monospace" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Logger Backend Types</text>

  <!-- Row 1: Core Backends -->
  <!-- Stdout Backend -->
  <g id="stdout-backend">
    <rect x="30" y="55" width="220" height="195" rx="8" fill="#2a2a2a" stroke="#4a6a4a" stroke-width="2"/>
    <text x="140" y="80" font-family="monospace" font-size="13" fill="#8f8" text-anchor="middle" font-weight="bold">Stdout Backend</text>
    <text x="140" y="98" font-family="monospace" font-size="9" fill="#6a6" text-anchor="middle">(Default)</text>

    <rect x="45" y="110" width="190" height="120" rx="6" fill="#1a2a1a" stroke="#3a4a3a" stroke-width="1"/>
    <text x="140" y="132" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Features</text>
    <text x="140" y="152" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">ANSI color codes</text>
    <text x="140" y="167" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Channel name prefixes</text>
    <text x="140" y="182" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Immediate sync output</text>
    <text x="140" y="197" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Errors to stderr</text>
    <text x="140" y="220" font-family="monospace" font-size="8" fill="#8f8" text-anchor="middle">createStdoutBackend()</text>
  </g>

  <!-- File Backend -->
  <g id="file-backend">
    <rect x="260" y="55" width="220" height="195" rx="8" fill="#2a2a2a" stroke="#6a4a4a" stroke-width="2"/>
    <text x="370" y="80" font-family="monospace" font-size="13" fill="#fa8" text-anchor="middle" font-weight="bold">File Backend</text>

    <rect x="275" y="100" width="190" height="130" rx="6" fill="#2a1a1a" stroke="#4a3a3a" stroke-width="1"/>
    <text x="370" y="120" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Features</text>
    <text x="370" y="140" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Async background thread</text>
    <text x="370" y="155" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Configurable flush interval</text>
    <text x="370" y="170" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Immediate flush on error</text>
    <text x="370" y="185" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Optional ANSI for less -R</text>
    <text x="370" y="200" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Lock-free queue</text>
    <text x="370" y="220" font-family="monospace" font-size="8" fill="#fa8" text-anchor="middle">createFileBackend(path, ...)</text>
  </g>

  <!-- HTML Backend -->
  <g id="html-backend">
    <rect x="490" y="55" width="220" height="195" rx="8" fill="#2a2a2a" stroke="#5a4a6a" stroke-width="2"/>
    <text x="600" y="80" font-family="monospace" font-size="13" fill="#c8f" text-anchor="middle" font-weight="bold">HTML Backend</text>

    <rect x="505" y="100" width="190" height="130" rx="6" fill="#1a1a2a" stroke="#3a3a4a" stroke-width="1"/>
    <text x="600" y="120" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Features</text>
    <text x="600" y="140" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Interactive channel toggles</text>
    <text x="600" y="155" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Smart contrast colors</text>
    <text x="600" y="170" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Entry count display</text>
    <text x="600" y="185" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Crash-resilient scripts</text>
    <text x="600" y="200" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Works with file://</text>
    <text x="600" y="220" font-family="monospace" font-size="8" fill="#c8f" text-anchor="middle">createHtmlBackend(path, ms)</text>
  </g>

  <!-- HTTP Backend -->
  <g id="http-backend">
    <rect x="720" y="55" width="220" height="195" rx="8" fill="#2a2a2a" stroke="#4a6a6a" stroke-width="2"/>
    <text x="830" y="80" font-family="monospace" font-size="13" fill="#6c8" text-anchor="middle" font-weight="bold">HTTP Backend</text>

    <rect x="735" y="100" width="190" height="130" rx="6" fill="#1a2a2a" stroke="#3a4a4a" stroke-width="1"/>
    <text x="830" y="120" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Features</text>
    <text x="830" y="140" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">ZMQ PUB socket</text>
    <text x="830" y="155" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Real-time web dashboard</text>
    <text x="830" y="170" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Multi-client support</text>
    <text x="830" y="185" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">SSE broadcast</text>
    <text x="830" y="200" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Status + perf graphs</text>
    <text x="830" y="220" font-family="monospace" font-size="8" fill="#6c8" text-anchor="middle">createHttpBackend(port)</text>
  </g>

  <!-- Fork Backend -->
  <g id="fork-backend">
    <rect x="950" y="55" width="220" height="195" rx="8" fill="#2a2a2a" stroke="#5a6a5a" stroke-width="2"/>
    <text x="1060" y="80" font-family="monospace" font-size="13" fill="#8ff" text-anchor="middle" font-weight="bold">Fork Backend</text>

    <rect x="965" y="100" width="190" height="130" rx="6" fill="#1a2a2a" stroke="#3a4a4a" stroke-width="1"/>
    <text x="1060" y="120" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Features</text>
    <text x="1060" y="140" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Multiplexes to N children</text>
    <text x="1060" y="155" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Independent child config</text>
    <text x="1060" y="170" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Env syntax: [A,B,C]</text>
    <text x="1060" y="185" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Dynamic child addition</text>
    <text x="1060" y="200" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Preserves thread safety</text>
    <text x="1060" y="220" font-family="monospace" font-size="8" fill="#8ff" text-anchor="middle">createForkBackend([])</text>
  </g>

  <!-- Row 2: Platform Backends -->
  <!-- UI Backend -->
  <g id="ui-backend">
    <rect x="260" y="270" width="260" height="195" rx="8" fill="#2a2a2a" stroke="#6a4a6a" stroke-width="2"/>
    <text x="390" y="295" font-family="monospace" font-size="13" fill="#c6f" text-anchor="middle" font-weight="bold">UI Backend (ork.lev2)</text>

    <rect x="275" y="315" width="230" height="130" rx="6" fill="#2a1a2a" stroke="#4a3a4a" stroke-width="1"/>
    <text x="390" y="335" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Features</text>
    <text x="390" y="355" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">In-engine widget</text>
    <text x="390" y="370" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">LoggerGroup + TabWidget</text>
    <text x="390" y="385" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">GraphView for perf metrics</text>
    <text x="390" y="400" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Channel regex filtering</text>
    <text x="390" y="415" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">GPU-accelerated rendering</text>
    <text x="390" y="435" font-family="monospace" font-size="8" fill="#c6f" text-anchor="middle">LoggerUIBackend::create()</text>
  </g>

  <!-- iOS UI Backend -->
  <g id="ios-ui-backend">
    <rect x="680" y="270" width="260" height="195" rx="8" fill="#2a2a2a" stroke="#4a5a5a" stroke-width="2"/>
    <text x="810" y="295" font-family="monospace" font-size="13" fill="#8cc" text-anchor="middle" font-weight="bold">iOS UI Backend</text>

    <rect x="695" y="315" width="230" height="130" rx="6" fill="#1a2a2a" stroke="#3a4a4a" stroke-width="1"/>
    <text x="810" y="335" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Features</text>
    <text x="810" y="355" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Native UIKit</text>
    <text x="810" y="370" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Per-channel UIViewControllers</text>
    <text x="810" y="385" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Tab navigation</text>
    <text x="810" y="400" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">Auto-scroll + channel colors</text>
    <text x="810" y="415" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">dispatch_async thread-safe</text>
    <text x="810" y="435" font-family="monospace" font-size="8" fill="#8cc" text-anchor="middle">installIOSUIToBackend()</text>
  </g>

  <!-- Data Flow Section -->
  <g id="data-flow">
    <rect x="30" y="485" width="1140" height="195" rx="8" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
    <text x="600" y="510" font-family="monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Backend Data Flow</text>

    <!-- Log Source -->
    <rect x="60" y="535" width="110" height="50" rx="6" fill="#2a2a3a" stroke="#4a4a5a" stroke-width="1"/>
    <text x="115" y="558" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Log Call</text>
    <text x="115" y="575" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">chan->log(...)</text>

    <!-- Format -->
    <rect x="200" y="535" width="110" height="50" rx="6" fill="#3a2a2a" stroke="#5a4a4a" stroke-width="1"/>
    <text x="255" y="558" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Format</text>
    <text x="255" y="575" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">vsnprintf</text>

    <!-- Backend -->
    <rect x="340" y="535" width="130" height="50" rx="6" fill="#2a3a2a" stroke="#4a5a4a" stroke-width="1"/>
    <text x="405" y="558" font-family="monospace" font-size="10" fill="white" text-anchor="middle">Backend</text>
    <text x="405" y="575" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">_add_log_line()</text>

    <!-- Sync path -->
    <rect x="500" y="525" width="100" height="28" rx="4" fill="#1a2a1a" stroke="#3a4a3a" stroke-width="1"/>
    <text x="550" y="544" font-family="monospace" font-size="9" fill="#8f8" text-anchor="middle">sync printf</text>

    <!-- Async paths -->
    <rect x="500" y="558" width="100" height="28" rx="4" fill="#2a1a1a" stroke="#4a3a3a" stroke-width="1"/>
    <text x="550" y="577" font-family="monospace" font-size="9" fill="#fa8" text-anchor="middle">async queue</text>

    <rect x="500" y="591" width="100" height="28" rx="4" fill="#1a2a2a" stroke="#3a4a4a" stroke-width="1"/>
    <text x="550" y="610" font-family="monospace" font-size="9" fill="#6c8" text-anchor="middle">ZMQ send</text>

    <rect x="500" y="624" width="100" height="28" rx="4" fill="#2a1a2a" stroke="#4a3a4a" stroke-width="1"/>
    <text x="550" y="643" font-family="monospace" font-size="9" fill="#c6f" text-anchor="middle">UI queue</text>

    <!-- Queue -->
    <rect x="630" y="550" width="90" height="85" rx="6" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <text x="675" y="572" font-family="monospace" font-size="9" fill="white" text-anchor="middle">Queue</text>
    <text x="675" y="590" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">deque&lt;string&gt;</text>
    <text x="675" y="605" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">lock-free</text>
    <text x="675" y="620" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">atomic ops</text>

    <!-- Writer Thread -->
    <rect x="750" y="550" width="110" height="85" rx="6" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <text x="805" y="572" font-family="monospace" font-size="9" fill="white" text-anchor="middle">Writer</text>
    <text x="805" y="590" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">flush interval</text>
    <text x="805" y="605" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">immediate on</text>
    <text x="805" y="620" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">warn/error</text>

    <!-- Output -->
    <rect x="890" y="550" width="100" height="85" rx="6" fill="#1a2a1a" stroke="#3a4a3a" stroke-width="1"/>
    <text x="940" y="572" font-family="monospace" font-size="9" fill="#8f8" text-anchor="middle">Output</text>
    <text x="940" y="590" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">file.write()</text>
    <text x="940" y="605" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">zmq.send()</text>
    <text x="940" y="620" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">widget.draw()</text>

    <!-- Destinations -->
    <rect x="1020" y="525" width="130" height="115" rx="6" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <text x="1085" y="547" font-family="monospace" font-size="9" fill="white" text-anchor="middle">Destinations</text>
    <text x="1085" y="567" font-family="monospace" font-size="7" fill="#8f8" text-anchor="middle">Terminal</text>
    <text x="1085" y="582" font-family="monospace" font-size="7" fill="#fa8" text-anchor="middle">Log File</text>
    <text x="1085" y="597" font-family="monospace" font-size="7" fill="#c8f" text-anchor="middle">HTML File</text>
    <text x="1085" y="612" font-family="monospace" font-size="7" fill="#6c8" text-anchor="middle">Web Browser</text>
    <text x="1085" y="627" font-family="monospace" font-size="7" fill="#c6f" text-anchor="middle">App Window / iOS</text>

    <!-- Arrows -->
    <line x1="170" y1="560" x2="200" y2="560" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="310" y1="560" x2="340" y2="560" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="470" y1="560" x2="500" y2="539" stroke="#8f8" stroke-width="1" marker-end="url(#arrow-green)"/>
    <line x1="470" y1="560" x2="500" y2="572" stroke="#fa8" stroke-width="1" marker-end="url(#arrow-orange)"/>
    <line x1="470" y1="560" x2="500" y2="605" stroke="#6c8" stroke-width="1" marker-end="url(#arrow-teal)"/>
    <line x1="470" y1="560" x2="500" y2="638" stroke="#c6f" stroke-width="1" marker-end="url(#arrow-violet)"/>
    <line x1="600" y1="572" x2="630" y2="590" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="720" y1="590" x2="750" y2="590" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="860" y1="590" x2="890" y2="590" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="990" y1="590" x2="1020" y2="590" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8f8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#fa8"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6c8"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#c6f"/>
    </marker>
  </defs>
</svg>
