name: Custom Build
on: [push, pull_request]

jobs:
  build:
    runs-on: self-hosted  # Or ubuntu-latest for GitHub-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Environment
      run: |
        # Create temp dir with timestamp for uniqueness
        export TMPDIR="${{ runner.temp }}/build-$(date +%s)"
        mkdir -p "$TMPDIR"
        echo "BUILD_TMPDIR=$TMPDIR" >> $GITHUB_ENV
        echo "Created temp dir: $TMPDIR"
        python3 -m venv $TMPDIR/venv
        source $TMPDIR/venv/bin/activate
        pip install ork.build==0.0.287dev2
        obt.env.create.py --stagedir $TMPDIR/staging

    - name: Run Minimal Environment Build
      run: |
        source ${{ env.BUILD_TMPDIR }}/venv/bin/activate
        obt.versions.py
        obt.env.launch.py --stagedir $TMPDIR/staging --command "obt.dep.build.py orkid"
      env:
        BUILD_CONFIG: ${{ matrix.config }}
        TMPDIR: ${{ env.BUILD_TMPDIR }}
    
    # Optional: matrix builds
    strategy:
      matrix:
        config: [release]