worker_processes auto;
# Log to both file and stderr (docker logs)
error_log /var/log/nginx/error.log warn;
error_log stderr info;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    lua_package_path "/usr/local/openresty/nginx/?.lua;;";
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    # Enhanced logging for CDN operations
    log_format cdn_detailed '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent '
                           '"$http_x_api_key" "$http_user_agent" '
                           'rt=$request_time '
                           'ul="$upstream_response_length" '
                           'ut="$upstream_response_time"';
    
    # Log to files
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/cdn.log cdn_detailed;
    
    # Also log to stdout for docker logs (with custom format for visibility)
    access_log /dev/stdout cdn_detailed;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }
    
    server {
        listen 443 ssl;
        server_name _;
        
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        
        # Basic SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        location /download {
            # Only allow GET and HEAD methods
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            
            # Rate limiting
            limit_req zone=download_limit burst=20 nodelay;
            
            # Authentication via Lua
            access_by_lua_file /usr/local/openresty/nginx/auth.lua;
            
            # Download logging
            log_by_lua_block {
                local client_ip = ngx.var.remote_addr
                local request_uri = ngx.var.request_uri
                local method = ngx.var.request_method
                local status = ngx.var.status
                local bytes_sent = ngx.var.bytes_sent
                local request_time = ngx.var.request_time
                local api_key = ngx.var.http_x_api_key or ngx.var.arg_key
                
                if status == "200" then
                    local file_path = request_uri:match("^/download/(.*)")
                    if method == "GET" then
                        local rate = tonumber(bytes_sent) / tonumber(request_time) / 1024 -- KB/s
                        ngx.log(ngx.INFO, "Download completed: ", client_ip, " <- ", file_path or "unknown",
                                " size:", bytes_sent, " duration:", request_time, "s",
                                " rate:", string.format("%.1f", rate), "KB/s",
                                " key:", api_key and string.sub(api_key, 1, 8) .. "..." or "none")
                    else
                        ngx.log(ngx.INFO, "HEAD request: ", client_ip, " <- ", file_path or "unknown",
                                " key:", api_key and string.sub(api_key, 1, 8) .. "..." or "none")
                    end
                else
                    ngx.log(ngx.WARN, method, " failed: ", client_ip, " ", request_uri, " status:", status)
                end
            }
            
            # Serve files
            alias /cdn/content/;
            autoindex off;
            
            # Security for path traversal
            if ($request_uri ~ "\.\.") {
                return 403;
            }
            
            # Set content type for encrypted data
            default_type application/octet-stream;
            
            # Cache control for immutable encrypted assets
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        location /upload {
            # Only allow PUT method
            if ($request_method != PUT) {
                return 405;
            }
            
            # Rate limiting for uploads
            limit_req zone=upload_limit burst=5 nodelay;
            
            # Authentication via Lua
            access_by_lua_file /usr/local/openresty/nginx/auth.lua;
            
            # Upload handling via Lua
            content_by_lua_file /usr/local/openresty/nginx/upload.lua;
            
            # Security for path traversal
            if ($request_uri ~ "\.\.") {
                return 403;
            }
            
            # Set max body size (adjust as needed)
            client_max_body_size 1G;
            client_body_buffer_size 128k;
            client_body_timeout 300s;
        }
        
        location /api {
            # API endpoints for CDN operations
            # Only allow standard HTTP methods
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            
            # Rate limiting
            limit_req zone=api_limit burst=30 nodelay;
            
            # Authentication via Lua (except for /api/health)
            access_by_lua_block {
                -- Skip auth for health endpoint
                if ngx.var.uri ~= "/api/health" then
                    local auth = loadfile("/usr/local/openresty/nginx/auth.lua")
                    if auth then
                        auth()
                    end
                end
            }
            
            # Handle API endpoints via Lua
            content_by_lua_file /usr/local/openresty/nginx/api.lua;
            
            # Security for path traversal
            if ($request_uri ~ "\.\.") {
                return 403;
            }
        }
        
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        location / {
            return 403;
        }
    }
}